<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The browser jobs' system font (issue 247). Playwright's image has no DejaVu Sans, the runner's, and its fontconfig
     falls back to WenQuanYi Zen Hei, a Chinese font, for the page's system-ui. Liberation Sans, in the image already,
     has Arial's widths: a Latin font a visitor may well have, for the layout tests to measure. -->
<fontconfig>
  <alias binding="strong"><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
