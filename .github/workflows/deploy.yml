name: Test and deploy

# A release branch (release/X.Y.Z, docs/releasing.md) and a pull request run every check below; only main deploys.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A run on main deploys, so once started it is never cancelled: a newer push waits for it (and replaces an older one
# still waiting, which has not started).
# A pull request or a release branch runs in a group of its own ref, which can never be main's (a pull request's ref is
# refs/pull/N/merge), and a newer push to it cancels its older run, whose result no longer counts (issue 111).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main' || format('checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The checks run side by side, and the site deploys only once all are green. The end-to-end tests, three quarters of
# the time when they ran in one job (23 of 28 minutes for 1.16.1), are split over twelve: Chromium in four shards,
# WebKit in eight of one worker each. GitHub's Linux WebKit draws 8 to 25 frames a second, and two of its workers
# side by side starved each other's animations (1.24.0's branch run, issue 232).
jobs:
  # The types, the lint (Biome: React hooks rules, imports organised), the unit tests, and the site as published.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run lint
      - run: npm run test:unit
      # The published site counts visits on the owner's GoatCounter; a fork's workflow sets its own address, or none.
      - run: npm run build
        env:
          GOATCOUNTER_URL: ${{ github.repository == 'gijom33/limpide' && 'https://gijom33.goatcounter.com/count' || '' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The engine renders real audio in Chromium; the end-to-end tests play the built site in Chromium and WebKit. Both
  # run in Playwright's own image, its browsers and their system libraries already in it, on the Ubuntu release of
  # GitHub's runner (24.04, noble): installing the libraries on the bare runner hung now and then on GitHub's side
  # (twice on 2026-10-27, four times for 1.25.0; issue 247). Its fonts, which the layout tests are measured in, are the
  # image's now, not the runner's, the system font set to Liberation Sans (.github/fonts.conf says why). The image's
  # tag follows the lock file's Playwright, checked before anything is
  # installed. --ipc=host keeps Chromium from running out of shared memory, as Playwright's guide for the image says.
  # GitHub still sets CI inside the container, so the skips for its Linux WebKit still apply.
  browsers:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine, browser: chromium }
          - { name: e2e chromium 1/4, browser: chromium, shard: 1/4 }
          - { name: e2e chromium 2/4, browser: chromium, shard: 2/4 }
          - { name: e2e chromium 3/4, browser: chromium, shard: 3/4 }
          - { name: e2e chromium 4/4, browser: chromium, shard: 4/4 }
          - { name: e2e webkit 1/8, browser: webkit, shard: 1/8 }
          - { name: e2e webkit 2/8, browser: webkit, shard: 2/8 }
          - { name: e2e webkit 3/8, browser: webkit, shard: 3/8 }
          - { name: e2e webkit 4/8, browser: webkit, shard: 4/8 }
          - { name: e2e webkit 5/8, browser: webkit, shard: 5/8 }
          - { name: e2e webkit 6/8, browser: webkit, shard: 6/8 }
          - { name: e2e webkit 7/8, browser: webkit, shard: 7/8 }
          - { name: e2e webkit 8/8, browser: webkit, shard: 8/8 }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node --experimental-strip-types --no-warnings scripts/playwrightImage.ts
      - run: mkdir -p ~/.config/fontconfig && cp .github/fonts.conf ~/.config/fontconfig/fonts.conf && fc-match system-ui
      - run: npm ci
      - if: matrix.name == 'engine'
        run: npm run test:engine
      - if: matrix.shard
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }} ${{ matrix.browser == 'webkit' && '--workers=1' || '' }}
      - if: failure() && matrix.shard
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, browsers]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never one stopped halfway (as GitHub's own Pages workflow): a newer one waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
