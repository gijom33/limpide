name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The types and the lint (Biome: React hooks rules, imports organised, so no duplicate import).
      - run: npx tsc
      - run: npm run lint
      - run: npm run test:unit
      # The engine renders real audio in Chromium; the end-to-end tests play the built site in Chromium and WebKit.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:engine
      # The published site counts visits on the owner's GoatCounter; a fork's workflow sets its own address, or none.
      - run: npm run build
        env:
          GOATCOUNTER_URL: ${{ github.repository == 'gijom33/limpide' && 'https://gijom33.goatcounter.com/count' || '' }}
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
