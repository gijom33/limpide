<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Limpide</title>
    <!-- What Limpide is, by what it shows (issue 236): the search result's line and a shared link's preview. -->
    <meta name="description" content="A synthesizer you can see through: the wave and its Harmonics after every stage, as you play." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Limpide" />
    <meta property="og:description" content="A synthesizer you can see through: the wave and its Harmonics after every stage, as you play." />
    <!-- The SVG, then the ICO last: a browser takes the last icon it can draw, and Safari drew neither the SVG nor the
         PNG in its tabs, nor the ICO while listed first (issue 65). The ICO's name is new, as Safari keeps the icons it
         has already fetched; the PNG inside it is the 32 px one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/tab-icon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
